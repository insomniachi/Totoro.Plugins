name: Build and Release Plugins

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        path: Totoro.Plugins

    - name: Checkout Totoro Core
      uses: actions/checkout@v4
      with:
        repository: insomniachi/Totoro
        ref: next
        path: Totoro

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      working-directory: Totoro.Plugins
      run: dotnet restore Totoro.Plugins.slnx

    - name: Run Tests
      working-directory: Totoro.Plugins
      run: dotnet test Totoro.Plugins.slnx -c Release --no-restore

    - name: Build and Package Plugins (Release)
      working-directory: Totoro.Plugins
      run: dotnet build Totoro.Plugins.slnx -c Release --no-restore

    - name: Collect Artifacts
      id: collect
      working-directory: Totoro.Plugins
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path "dist" -Force
        Get-ChildItem -Path "src" -Recurse -Filter "*.totoro-plugin" | ForEach-Object {
          Copy-Item $_.FullName -Destination "dist" -Force
          Write-Host "Collected plugin package: $($_.Name)"
        }

        # Generate plugins.json catalog manifest
        $catalog = @()
        Get-ChildItem -Path "src" -Recurse -Filter "plugin.json" | Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' } | ForEach-Object {
          $content = Get-Content $_.FullName -Raw | ConvertFrom-Json
          $pluginName = $_.Directory.Name.Replace("Totoro.Plugins.", "")
          $packageFile = "$pluginName.totoro-plugin"
          $catalog += [PSCustomObject]@{
            id = $content.id
            name = $content.name
            version = $content.version
            description = $content.description
            author = $content.author
            iconUrl = $content.iconUrl
            minTotoroVersion = $content.minTotoroVersion
            packageFileName = $packageFile
          }
        }
        $catalogJson = $catalog | ConvertTo-Json -Depth 5
        Set-Content -Path "dist\plugins.json" -Value $catalogJson
        Write-Host "Generated plugins.json catalog."

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Totoro-Plugins
        path: Totoro.Plugins/dist/*

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: Totoro.Plugins/dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
