name: Release Plugin

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin to release'
        required: true
        type: choice
        # Every plugin in src, alphabetical (PluginVerificationTests checks both).
        options:
          - AnimePahe
          - KickAssAnime
          - Kitsu
          - MangaFire
          - RealDebrid
          - ReAnime
          - Senshi
          - Shikimori
          - SubsPlease
          - TorBox
          - TsukiHime
          - WeebCentral
      version:
        description: 'Version (e.g. 1.0.1) - leave blank to auto-increment patch from current version'
        required: false
        type: string
      release_notes:
        description: 'Release Notes'
        required: false
        type: string

permissions:
  contents: write

# Releases all rewrite plugins.json, so they run one at a time.
concurrency:
  group: release-plugin
  cancel-in-progress: false

env:
  # Inputs reach the scripts as environment variables, never pasted into them, so their text can't run as code.
  PLUGIN: ${{ github.event.inputs.plugin }}
  INPUT_VERSION: ${{ github.event.inputs.version }}
  RELEASE_NOTES: ${{ github.event.inputs.release_notes }}

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        path: Totoro.Plugins
        fetch-depth: 0

    - name: Parse Plugin and Version
      id: parse
      working-directory: Totoro.Plugins
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $pluginName = $env:PLUGIN
        $inputVersion = "$env:INPUT_VERSION".Trim()
        $manifest = Get-Content "src/Totoro.Plugins.$pluginName/plugin.json" -Raw | ConvertFrom-Json

        if ([string]::IsNullOrWhiteSpace($inputVersion)) {
          $currentVersion = $manifest.version

          # Cross-check with plugins.json to ensure we increment from the highest released version
          if (Test-Path "plugins.json") {
            $catalog = Get-Content "plugins.json" -Raw | ConvertFrom-Json
            $catalogEntry = $catalog | Where-Object { $_.id -eq $manifest.id }
            if ($catalogEntry -and $catalogEntry.version) {
              if ([Version]::TryParse($catalogEntry.version, [ref]$null) -and [Version]::TryParse($currentVersion, [ref]$null)) {
                if ([Version]$catalogEntry.version -gt [Version]$currentVersion) {
                  $currentVersion = $catalogEntry.version
                }
              }
            }
          }

          if ($currentVersion -match '^(?<major>\d+)\.(?<minor>\d+)(\.(?<patch>\d+))?') {
            $major = [int]$Matches['major']
            $minor = [int]$Matches['minor']
            $patch = if ($Matches['patch']) { [int]$Matches['patch'] } else { 0 }
            $nextPatch = $patch + 1
            $version = "$major.$minor.$nextPatch"
            Write-Host "Auto-incremented version from $currentVersion to $version"
          } else {
            Write-Error "Could not parse current version '$currentVersion' as a semantic version."
            exit 1
          }
        } else {
          $version = $inputVersion
          Write-Host "Using explicitly provided version: $version"
        }

        if ($version -notmatch '^\d+\.\d+\.\d+$') {
          Write-Error "Version '$version' isn't of the form 1.2.3."
          exit 1
        }

        $tag = "$pluginName-v$version"

        # A released version is never replaced: users who installed it, and the catalog's hash, refer to that package.
        gh release view $tag 2>$null | Out-Null
        if ($LASTEXITCODE -eq 0 -or (git tag --list $tag)) {
          Write-Error "$tag is already released. Release a new version instead."
          exit 1
        }

        # Built against the oldest Totoro the plugin says it runs on, so it can't use anything newer.
        $minAppVersion = if ($manifest.minAppVersion) { $manifest.minAppVersion } else { "2.0.0" }

        Write-Host "Releasing plugin: $pluginName version: $version with tag: $tag, against Totoro v$minAppVersion"
        "plugin_name=$pluginName" >> $env:GITHUB_OUTPUT
        "version=$version" >> $env:GITHUB_OUTPUT
        "tag=$tag" >> $env:GITHUB_OUTPUT
        "totoro_ref=v$minAppVersion" >> $env:GITHUB_OUTPUT

    - name: Checkout Totoro Core
      uses: actions/checkout@v4
      with:
        repository: insomniachi/Totoro
        ref: ${{ steps.parse.outputs.totoro_ref }}
        path: Totoro

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Update plugin.json Version
      working-directory: Totoro.Plugins
      shell: pwsh
      run: |
        $manifestPath = "src/Totoro.Plugins.${{ steps.parse.outputs.plugin_name }}/plugin.json"
        $json = Get-Content $manifestPath -Raw | ConvertFrom-Json
        $json.version = "${{ steps.parse.outputs.version }}"
        $updated = $json | ConvertTo-Json -Depth 5
        Set-Content -Path $manifestPath -Value $updated
        Write-Host "Set $manifestPath version to ${{ steps.parse.outputs.version }}"

    - name: Check Secrets
      if: steps.parse.outputs.plugin_name == 'Shikimori'
      shell: pwsh
      env:
        SHIKIMORI_CLIENT_ID: ${{ secrets.SHIKIMORI_CLIENT_ID }}
        SHIKIMORI_CLIENT_SECRET: ${{ secrets.SHIKIMORI_CLIENT_SECRET }}
      run: |
        # Without them the plugin builds, but can't log in.
        if (-not $env:SHIKIMORI_CLIENT_ID -or -not $env:SHIKIMORI_CLIENT_SECRET) {
          Write-Error "The SHIKIMORI_CLIENT_ID and SHIKIMORI_CLIENT_SECRET secrets aren't set."
          exit 1
        }

    - name: Build and Package Plugin
      working-directory: Totoro.Plugins
      env:
        SHIKIMORI_CLIENT_ID: ${{ secrets.SHIKIMORI_CLIENT_ID }}
        SHIKIMORI_CLIENT_SECRET: ${{ secrets.SHIKIMORI_CLIENT_SECRET }}
      run: |
        dotnet build "src/Totoro.Plugins.${{ steps.parse.outputs.plugin_name }}/Totoro.Plugins.${{ steps.parse.outputs.plugin_name }}.csproj" -c Release

    - name: Update plugins.json Catalog
      id: catalog
      working-directory: Totoro.Plugins
      shell: pwsh
      run: |
        $plugin = "${{ steps.parse.outputs.plugin_name }}"
        $tag = "${{ steps.parse.outputs.tag }}"
        $packagePath = "src/Totoro.Plugins.$plugin/bin/Release/Package/$plugin.totoro-plugin"

        if (-not (Test-Path $packagePath)) {
          Write-Error "Package not found at $packagePath"
          exit 1
        }

        $catalogPath = "plugins.json"
        $catalog = @()
        if (Test-Path $catalogPath) {
          $catalog = Get-Content $catalogPath -Raw | ConvertFrom-Json
          if ($catalog -isnot [System.Array]) { $catalog = @($catalog) }
        }

        $manifest = Get-Content "src/Totoro.Plugins.$plugin/plugin.json" -Raw | ConvertFrom-Json
        $downloadUrl = "https://github.com/insomniachi/Totoro.Plugins/releases/download/$tag/$plugin.totoro-plugin"

        $newEntry = [PSCustomObject]@{
          id = $manifest.id
          name = $manifest.name
          version = $manifest.version
          description = $manifest.description
          author = $manifest.author
          downloadUrl = $downloadUrl
          # Totoro checks the download against it before installing.
          sha256 = (Get-FileHash $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
          iconUrl = $manifest.iconUrl
          minTotoroVersion = if ($manifest.minAppVersion) { $manifest.minAppVersion } else { "2.0.0" }
          # The catalog names the interface ("IAnimeDatabase"), the manifest the type ("AnimeDatabase").
          moduleTypes = @($manifest.moduleTypes | ForEach-Object { "I$_" })
        }

        # Replace existing entry if found, otherwise append
        $filtered = @($catalog | Where-Object { $_.id -ne $manifest.id })
        $catalog = $filtered + $newEntry

        $catalogJson = $catalog | ConvertTo-Json -Depth 5
        Set-Content -Path $catalogPath -Value $catalogJson

        # The release's tag goes on the source the package was built from; the catalog commit comes after it.
        "source_sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
        "package_path=$packagePath" >> $env:GITHUB_OUTPUT

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add $catalogPath "src/Totoro.Plugins.$plugin/plugin.json"
        git commit -m "Update catalog for $plugin v${{ steps.parse.outputs.version }} [skip ci]"

    - name: Create GitHub Release and Publish Catalog
      working-directory: Totoro.Plugins
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $plugin = "${{ steps.parse.outputs.plugin_name }}"
        $ver = "${{ steps.parse.outputs.version }}"
        $tag = "${{ steps.parse.outputs.tag }}"

        $notes = $env:RELEASE_NOTES
        if ([string]::IsNullOrWhiteSpace($notes)) {
          $notes = "Release of $plugin plugin v$ver"
        }

        # The release first, so the catalog never lists a package that isn't there.
        gh release create $tag "${{ steps.catalog.outputs.package_path }}" `
          --target "${{ steps.catalog.outputs.source_sha }}" `
          --title "$plugin v$ver" `
          --notes "$notes"
        if ($LASTEXITCODE -ne 0) { exit 1 }

        git pull --rebase origin main
        if ($LASTEXITCODE -eq 0) { git push origin main }
        if ($LASTEXITCODE -ne 0) {
          # Undone, so a re-run releases the same version rather than leaving this one out of the catalog.
          Write-Error "Couldn't push the catalog; deleting release $tag."
          gh release delete $tag --cleanup-tag --yes
          exit 1
        }

        Write-Host "Release $tag ready."
