name: Release Plugin

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin to release'
        required: true
        type: choice
        options:
          - Senshi
          - SubsPlease
          - AnimePahe
          - ReAnime
      version:
        description: 'Version (e.g. 1.0.1) - leave blank to auto-increment patch from current version'
        required: false
        type: string
      release_notes:
        description: 'Release Notes'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        path: Totoro.Plugins
        fetch-depth: 0

    - name: Checkout Totoro Core
      uses: actions/checkout@v4
      with:
        repository: insomniachi/Totoro
        ref: main
        path: Totoro

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Parse Plugin and Version
      id: parse
      working-directory: Totoro.Plugins
      shell: pwsh
      run: |
        $pluginName = "${{ github.event.inputs.plugin }}"
        $inputVersion = "${{ github.event.inputs.version }}".Trim()

        if ([string]::IsNullOrWhiteSpace($inputVersion)) {
          $manifest = Get-Content "src/Totoro.Plugins.$pluginName/plugin.json" -Raw | ConvertFrom-Json
          $currentVersion = $manifest.version

          # Cross-check with plugins.json to ensure we increment from the highest released version
          if (Test-Path "plugins.json") {
            $catalog = Get-Content "plugins.json" -Raw | ConvertFrom-Json
            $catalogEntry = $catalog | Where-Object { $_.name -eq $pluginName -or $_.id -eq $manifest.id }
            if ($catalogEntry -and $catalogEntry.version) {
              if ([Version]::TryParse($catalogEntry.version, [ref]$null) -and [Version]::TryParse($currentVersion, [ref]$null)) {
                if ([Version]$catalogEntry.version -gt [Version]$currentVersion) {
                  $currentVersion = $catalogEntry.version
                }
              }
            }
          }

          if ($currentVersion -match '^(?<major>\d+)\.(?<minor>\d+)(\.(?<patch>\d+))?') {
            $major = [int]$Matches['major']
            $minor = [int]$Matches['minor']
            $patch = if ($Matches['patch']) { [int]$Matches['patch'] } else { 0 }
            $nextPatch = $patch + 1
            $version = "$major.$minor.$nextPatch"
            Write-Host "Auto-incremented version from $currentVersion to $version"
          } else {
            Write-Error "Could not parse current version '$currentVersion' as a semantic version."
            exit 1
          }
        } else {
          $version = $inputVersion
          Write-Host "Using explicitly provided version: $version"
        }

        $tag = "$pluginName-v$version"
        Write-Host "Releasing plugin: $pluginName version: $version with tag: $tag"
        "plugin_name=$pluginName" >> $env:GITHUB_OUTPUT
        "version=$version" >> $env:GITHUB_OUTPUT
        "tag=$tag" >> $env:GITHUB_OUTPUT

    - name: Update plugin.json Version
      working-directory: Totoro.Plugins
      shell: pwsh
      run: |
        $manifestPath = "src/Totoro.Plugins.${{ steps.parse.outputs.plugin_name }}/plugin.json"
        $json = Get-Content $manifestPath -Raw | ConvertFrom-Json
        $json.version = "${{ steps.parse.outputs.version }}"
        $updated = $json | ConvertTo-Json -Depth 5
        Set-Content -Path $manifestPath -Value $updated
        Write-Host "Set $manifestPath version to ${{ steps.parse.outputs.version }}"

    - name: Build and Package Plugin
      working-directory: Totoro.Plugins
      run: |
        dotnet build "src/Totoro.Plugins.${{ steps.parse.outputs.plugin_name }}/Totoro.Plugins.${{ steps.parse.outputs.plugin_name }}.csproj" -c Release

    - name: Create GitHub Release and Upload Asset
      working-directory: Totoro.Plugins
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $plugin = "${{ steps.parse.outputs.plugin_name }}"
        $ver = "${{ steps.parse.outputs.version }}"
        $tag = "${{ steps.parse.outputs.tag }}"
        $packagePath = "src/Totoro.Plugins.$plugin/bin/Release/Package/$plugin.totoro-plugin"

        if (-not (Test-Path $packagePath)) {
          Write-Error "Package not found at $packagePath"
          exit 1
        }

        $notes = "${{ github.event.inputs.release_notes }}"
        if ([string]::IsNullOrWhiteSpace($notes)) {
          $notes = "Release of $plugin plugin v$ver"
        }

        $releaseExists = $false
        gh release view $tag 2>$null
        if ($LASTEXITCODE -eq 0) {
          $releaseExists = $true
        }

        if ($releaseExists) {
          Write-Host "Release $tag already exists; uploading/updating asset..."
          gh release upload $tag $packagePath --clobber
        } else {
          gh release create $tag $packagePath `
            --title "$plugin v$ver" `
            --notes "$notes"
        }

        Write-Host "Release $tag ready."

    - name: Update plugins.json Catalog
      working-directory: Totoro.Plugins
      shell: pwsh
      run: |
        $catalogPath = "plugins.json"
        $catalog = @()
        if (Test-Path $catalogPath) {
          $catalog = Get-Content $catalogPath -Raw | ConvertFrom-Json
          if ($catalog -isnot [System.Array]) { $catalog = @($catalog) }
        }

        $plugin = "${{ steps.parse.outputs.plugin_name }}"
        $manifest = Get-Content "src/Totoro.Plugins.$plugin/plugin.json" -Raw | ConvertFrom-Json
        $tag = "${{ steps.parse.outputs.tag }}"
        $downloadUrl = "https://github.com/insomniachi/Totoro.Plugins/releases/download/$tag/$plugin.totoro-plugin"

        $newEntry = [PSCustomObject]@{
          id = $manifest.id
          name = $manifest.name
          version = $manifest.version
          description = $manifest.description
          author = $manifest.author
          downloadUrl = $downloadUrl
          iconUrl = $manifest.iconUrl
          minTotoroVersion = "2.0.0"
          moduleTypes = @("IAnimeProvider")
        }

        # Replace existing entry if found, otherwise append
        $filtered = @($catalog | Where-Object { $_.id -ne $manifest.id })
        $catalog = $filtered + $newEntry

        $catalogJson = $catalog | ConvertTo-Json -Depth 5
        Set-Content -Path $catalogPath -Value $catalogJson

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add $catalogPath "src/Totoro.Plugins.$plugin/plugin.json"
        $status = git status --porcelain
        if ($status) {
          git commit -m "Update catalog for $plugin v${{ steps.parse.outputs.version }} [skip ci]"
          git pull --rebase origin main
          git push origin main
        }
        Write-Host "Catalog updated successfully."