name: Check Providers

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

# Shares the release workflow's group: both push to main.
concurrency:
  group: release-plugin
  cancel-in-progress: false

jobs:
  check:
    # The AniPM test drives curl.exe from System32.
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        path: Totoro.Plugins

    # Beside this repository, so the plugins build against it as they do locally.
    - name: Checkout Totoro Core
      uses: actions/checkout@v7
      with:
        repository: insomniachi/Totoro
        path: Totoro

    - name: Setup .NET 11
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '11.0.x'

    - name: Run Live Tests
      id: check
      working-directory: Totoro.Plugins
      shell: pwsh
      continue-on-error: true
      run: ./.github/scripts/check-providers.ps1

    - name: Commit Status
      working-directory: Totoro.Plugins
      shell: pwsh
      run: |
        git diff --quiet -- README.md
        if ($LASTEXITCODE -eq 0) { exit 0 }
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add README.md
        git commit -m "Update provider status [skip ci]"
        git pull --rebase origin main
        if ($LASTEXITCODE -eq 0) { git push origin main }
        exit $LASTEXITCODE

    - name: Report Broken Providers
      if: steps.check.outcome == 'failure'
      shell: pwsh
      run: |
        Write-Error "A provider is broken (or the check couldn't run); see Run Live Tests."
        exit 1
